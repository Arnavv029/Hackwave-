# Local PostgreSQL for development. Credentials here are for local use only
# and must match DATABASE_URL in your .env.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: driftguard
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: driftguard
    ports:
      - '5432:5432'
    volumes:
      - driftguard-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U driftguard -d driftguard']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  driftguard-pgdata:
